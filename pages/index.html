<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroVault - Aerospace Knowledge Hub</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 50%, #2d3748 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .loading-container { text-align: center; position: relative; }
        .logo { font-size: 3rem; font-weight: bold; margin-bottom: 1rem; background: linear-gradient(45deg, #00d4ff, #0099cc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: glow 2s ease-in-out infinite alternate; }
        .tagline { font-size: 1.2rem; margin-bottom: 2rem; opacity: 0.8; }
        .loading-spinner { width: 50px; height: 50px; border: 3px solid rgba(255, 255, 255, 0.3); border-top: 3px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        .loading-text { font-size: 1rem; opacity: 0.7; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes glow { from { text-shadow: 0 0 20px #00d4ff, 0 0 30px #00d4ff, 0 0 40px #00d4ff; } to { text-shadow: 0 0 30px #0099cc, 0 0 40px #0099cc, 0 0 50px #0099cc; } }

        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; animation: twinkle 3s infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="loading-container">
        <div class="logo">AeroVault</div>
        <div class="tagline">Exploring the Frontiers of Aerospace</div>
        <div class="loading-spinner"></div>
        <div class="loading-text">Initializing aerospace systems...</div>
    </div>

    <script>
    function createStars() {
        const starsContainer = document.getElementById('stars');
        const numberOfStars = 100;
        for (let i = 0; i < numberOfStars; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }
    }
    createStars();

    // CORRECT PATH
    setTimeout(() => {
        window.location.href = 'pages/homepage.html';
    }, 1500);
</script>
</body>
</html>
